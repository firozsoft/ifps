{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en-us' }}">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO MetaTags -->
    <meta name="robots" content="index, follow" />
    <meta name="description"
          content="{% block meta_description %}
                   {% endblock meta_description %}" />
    <meta name="keywords"
          content="{% block meta_keywords %}
                   {% endblock meta_keywords %}" />
    <!-- /SEO MetaTags -->
    <!-- FavIcon -->
    <link rel="shortcut icon"
          href="{% static 'img/favicon.ico' %}"
          type="image/x-icon" />
    <!-- Style -->
    <link rel="stylesheet" href="{% static 'css/mdb.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/fontawesome.all.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    {% block extra_heads %}
    {% endblock extra_heads %}
    <title>
      IFPS ·
      {% block title %}
      {% endblock title %}
    </title>

  </head>
  <body class="container-fluid">

    {% include "partials/navbar.html" %}

    <div class="container">
      {% block content %}
      {% endblock content %}
    </div>

    <!-- js -->
    <script type="text/javascript" src="{% static 'js/mdb.es.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/mdb.umd.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/htmx.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/main.js' %}"></script>
    {% block document_ready %}
    {% endblock document_ready %}
  </body>
</html>
