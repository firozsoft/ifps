<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-body-tertiary">
  <!-- Container wrapper -->
  <div class="container">
    <!-- Navbar brand -->
    <a class="navbar-brand me-2" href="{% url "fpl-submit" %}">
      <img src="noshadows.webp"
           height="16"
           alt="IFPS"
           loading="lazy"
           style="margin-top: -1px" />
    </a>
    <!-- Toggle button -->
    <button data-mdb-collapse-init
            class="navbar-toggler"
            type="button"
            data-mdb-target="#navbarButtonsExample"
            aria-controls="navbarButtonsExample"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <i class="fas fa-bars"></i>
    </button>
    <!-- Collapsible wrapper -->
    <div class="collapse navbar-collapse" id="navbarButtonsExample">
      <!-- Left links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="#">IFPS</a>
        </li>
      </ul>
      <!-- Left links -->
      <div class="d-flex align-items-center">
        {% if request.user.is_staff %}
          <a data-mdb-ripple-init
             href="{% url "admin:index" %}"
             class="btn btn-link px-1 mx-1 fw-bold">Admin</a>
        {% endif %}
        {% if request.user.is_authenticated %}
          <a data-mdb-ripple-init
             href="{% url "accounts:profile" %}"
             class="btn btn-link px-1 mx-1 fw-bold
                    {% if 'accounts/profile' in request.path %}
                      disabled
                    {% endif %}">Profile</a>
          <form id="logout-form" action="{% url "accounts:logout" %}" method="post">
            {% csrf_token %}
            <button data-mdb-ripple-init class="btn btn-link px-1 mx-1 fw-bold">
              Logout
            </button>
          </form>
        {% endif %}
        <li class="nav-item align-items-center d-flex ms-2">
          <label for="themingSwitcher">
            <i class="fas fa-sun"></i>
          </label>
          <!-- Default switch -->
          <div class="ms-2 form-check form-switch">
            <input class="form-check-input"
                   type="checkbox"
                   role="switch"
                   id="themingSwitcher" />
          </div>
          <label for="themingSwitcher">
            <i class="fas fa-moon"></i>
          </label>
        </li>
      </div>
    </div>
    <!-- Collapsible wrapper -->
  </div>
  <!-- Container wrapper -->
</nav>
<!-- Navbar -->
