[project]
name = "ifps"
version = "2024.0.0"
dependencies = [
  "dj-database-url",
  "django-auditlog~=3.0.0",
  "django-axes~=6.4.0",
  "django-import-export~=3.3.8",
  "Django~=5.0",
  "networkx~=3.2.1",
  "openpyxl~=3.1.2",
  "python-decouple",
]
requires-python = ">=3.11"
authors = [{ name = "Mahdi Firouzjah", email = "mh.firouzjah@gmail.com" }]
maintainers = [{ name = "Mahdi Firouzjah", email = "mh.firouzjah@gmail.com" }]

[project.optional-dependencies]
dev = [
  "django-debug-toolbar",
  "django-extensions",
  "djlint",
  "ipython",
  "jupyter",
  "pre-commit",
  "ruff",
]

[tool.ruff]
line-length = 110 # Specifies the maximum line length allowed in your code.
fix = true        # Enables automatic fixing of linting issues where possible.

# Ignore migrations directories
extend-exclude = [
  "migrations",
] # Excludes directories named "migrations" from linting.

target-version = "py312" # Specifies the target Python version for linting.

[tool.ruff.lint]
fixable = ["ALL"] # Allows Ruff to automatically fix all enabled linting rules.
extend-select = [ # Specifies the list of linting rules to enable.
  "A",   # prevent using keywords that clobber python builtins
  "B",   # bugbear: security warnings
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "Q",   # flake8-quotes
  "UP",  # alert you when better syntax is available in your python version
  "DJ",  # falke8-django
  "C4",  # McCabe complexity
  "D",   # docstring-related linting rules
  "DJ",  # Django-specific linting rules
  "N",   # Naming conventions
  "PL",  # PEP8 related linting rules
  "PT",  # PEP257 related linting rules
  "SIM", # Simplification of code
  "T20", # Deprecation-related linting rules
  "W",   # Additional warnings
]
extend-safe-fixes = [
  "E",
  "F401",
] # Specifies which fixes can be safely applied without --unsafe-fixes flag.
ignore = [ # Specifies the list of linting rules to ignore.
  "D100",    # Ignore missing docstring in public module.
  "D101",    # Ignore missing docstring in public class.
  "D102",    # Ignore missing docstring in public method.
  "D103",    # Ignore missing docstring in public function.
  "D104",    # Ignore missing docstring in public package.
  "D105",    # Ignore missing docstring in magic method.
  "D203",    # Ignore missing whitespace after ':'
  "D213",    # Ignore missing whitespace before ':'.
  "E501",    # Ignore line length exceeded (pycodestyle).
  "PLR0912", # Ignore argument name must be lowercase.
  "PLR0913", # Ignore too few arguments on decorators.
  "PLR0915", # Ignore too many arguments on decorators.
  "PLW1510", # Ignore too many locals.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "N802",
  "D103",
  "T201",
  "D104",
  "PLR0915",
  "PLR2004",
] # Specifies per-file linting ignores for files in the "tests" directory.
"src/djlint/__init__.py" = [
  "D403",
] # Specifies linting ignores for "__init__.py" in "src/djlint".
"src/djlint/formatter/__init__.py" = [
  "D104",
] # Specifies linting ignores for "__init__.py" in "src/djlint/formatter".
"src/djlint/formatter/css.py" = [
  "PLW2901",
] # Specifies linting ignores for "css.py" in "src/djlint/formatter".
"src/djlint/formatter/js.py" = [
  "PLW2901",
] # Specifies linting ignores for "js.py" in "src/djlint/formatter".
"src/djlint/lint.py" = [
  "PLW2901",
] # Specifies linting ignores for "lint.py" in "src/djlint".
"src/djlint/formatter/indent.py" = [
  "SIM114",
  "E722",
] # Specifies linting ignores for "indent.py" in "src/djlint/formatter".

[tool.ruff.lint.mccabe]
max-complexity = 10 # Specifies the maximum McCabe complexity allowed for functions.

[tool.ruff.format]
docstring-code-format = true # Enables reformatting of code snippets in docstrings.
line-ending = "auto"         # Specifies line ending to auto-detect.

[tool.djlint]
blank_line_after_tag = "load,extends,include"
blank_line_before_tag = "load,include"
close_void_tags = true
format_attribute_template_tags = true
format = true
format_css = true
format_js = true
ignore = "H006,H021"
indent = 2
line_break_after_multiline_tag = true
max_line_length = 120
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2
