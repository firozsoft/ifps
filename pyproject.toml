[project]
name = "ifps"
requires-python = ">=3.11"
dependencies = [
  "Django~=5.0",
  "pandas",
  "openpyxl",
  "python-decouple",
  "dj-database-url",
  "networkx",
]

[project.optional-dependencies]
dev = ["ipython", "django-debug-toolbar", "ruff", "djlint"]


[tool.ruff]
line-length = 110
# Enable the isort rules.
lint.extend-select = ["I"]
