repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.3.7
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      - id: django-test-runner
        name: django-test-runner
        entry: .venv/bin/python manage.py test
        always_run: false
        pass_filenames: false
        language: system
        types: [python]

      - id: djlint-reformat-django
        name: djLint formatting for Django
        entry: .venv/bin/djlint --reformat --profile=django --indent=2 --format-attribute-template-tags
        types_or: [html]
        language: python

      - id: djlint-django
        name: djLint linting for Django
        entry: .venv/bin/djlint --profile=django
        types_or: [html]
        language: python
