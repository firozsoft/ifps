repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.3.7
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      - id: django-test-runner
        name: Django tests must pass
        entry: .venv/bin/python manage.py test
        always_run: true
        pass_filenames: false
        language: system
        types: [python]